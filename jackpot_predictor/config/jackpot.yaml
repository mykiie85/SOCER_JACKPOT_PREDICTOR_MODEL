# SportPesa Jackpot Predictor configuration

# Confidence tier thresholds (probability of the top pick + margin over 2nd)
confidence:
  # Every published pick is labelled UNCERTAIN regardless of the thresholds
  # below. On the 131 graded fixtures to 2026-09-05 the labels were
  # anti-correlated with accuracy — HIGH hit 33% (n=3) while LOW hit 71%
  # (n=24) — so they misled rather than informed. The thresholds still run and
  # the verdict is kept as `uncapped_confidence_tier` so the suspension can be
  # audited on live output. Set to false only after
  # scripts/audit_confidence.py reports a monotone reliability curve AND
  # HIGH > MEDIUM > LOW on a hold-out.
  force_uncertain: true
  high:
    min_primary_prob: 0.55
    min_margin: 0.15
  medium:
    min_primary_prob: 0.45
    min_margin: 0.08
  uncertain_margin: 0.08   # margin below this => UNCERTAIN

# Scraping
scraper:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
  timeout: 30
  retries: 3
  cache_ttl_hours: 6

# Prediction sources
predictor:
  # Minimum rapidfuzz WRatio (on affix-stripped names) for a fuzzy team match.
  # Exact and prefix matches bypass this; it only gates the last-resort step.
  fuzzy_threshold: 88
  # A fuzzy hit is rejected as ambiguous unless it beats the runner-up by this
  # many points — "wrong team" is far worse than "fell back to market odds".
  fuzzy_ambiguity_margin: 6
  # When a fixture's league/teams are outside EdgeBot coverage, fall back to
  # de-vigged SportPesa odds (the jackpot API publishes 1X2 prices per match).
  odds_fallback: true
  # Blend for covered fixtures: p = w*model + (1-w)*odds_implied. 1.0 = model only.
  model_weight: 1.0
  # Tier-1 quality gate (the tier-2 equivalent lives inside EdgeBot's
  # Tier2Stack and needs no config here). Reads EdgeBot's
  # data_cache/tier1_gates.json, written by train_tier1_gate.py --write-gates:
  # a league whose walk-forward Brier does not significantly beat the
  # bookmaker's never displaces the market price. On the 2026-09-05 run that is
  # every one of the 22 tier-1 leagues, so this effectively routes tier-1
  # through de-vigged odds until a league earns its way back.
  tier1_gate:
    enabled: true
    # Policy for a tier-1 league with no gate entry (or no gates file at all).
    # "fail" = treat as gated out. Unknown is not the same as passing, and the
    # measured pass rate is 0 of 22, so the safe reading of silence is failure.
    missing: fail

# Market-odds calibration, applied to the odds-fallback path only.
#   method      - how the bookmaker margin is removed from the 1X2 prices.
#                 "power" (odds-ratio) and "shin" strip proportionally more
#                 from longshots than "proportional" does, which is the
#                 documented shape of the favourite-longshot bias.
#   temperature - p^t renormalized. t > 1 sharpens. Fitted at ~3.0 on the
#                 first 97 graded matches; held at 1.5 because that estimate
#                 carries a wide interval on so few games and shrinking a
#                 noisy calibration parameter toward 1.0 is the safe error.
#                 NOTE: this is monotone, so it never changes which outcome is
#                 picked — it only makes the stated confidence honest.
odds_calibration:
  method: power
  temperature: 1.5

# External insight sources (best-effort — failures never block a run)
insights:
  forebet:
    # OFF since 2026-08-29: Cloudflare has answered 403 to every request from
    # this host since 2026-07-17 — not a header problem, the plain HTML page is
    # blocked too, so the documented 0.25 consensus blend has never applied.
    # The only ways back in are a paid/allow-listed route or a real browser;
    # until one exists this just spends two failing requests a run. Flip back
    # to true and re-run to re-test.
    enabled: false
    # Require BOTH team names to clear this fuzzy score within the fixture's
    # country before trusting a Forebet record.
    min_match_score: 70
    # Blend Forebet's probabilities into ours: p = (1-w)*base + w*forebet.
    # 0 = display-only. Applied to model and odds-fallback fixtures alike.
    blend_weight: 0.25
  sofascore:
    enabled: true
    min_match_score: 65

# Scheduling: send predictions N days before the earliest kickoff, at HH:MM EAT
schedule:
  days_before: 2
  send_hour_eat: 20
  timezone: "Africa/Nairobi"

# Delivery
delivery:
  telegram:
    enabled: true
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 465
