# SportPesa Jackpot Predictor configuration

# Confidence tier thresholds (probability of the top pick + margin over 2nd)
confidence:
  # Every published pick is labelled UNCERTAIN regardless of the thresholds
  # below. On the 131 graded fixtures to 2026-09-05 the labels were
  # anti-correlated with accuracy — HIGH hit 33% (n=3) while LOW hit 71%
  # (n=24) — so they misled rather than informed. The thresholds still run and
  # the verdict is kept as `uncapped_confidence_tier` so the suspension can be
  # audited on live output. Set to false only after
  # scripts/audit_confidence.py reports a monotone reliability curve AND
  # HIGH > MEDIUM > LOW on a hold-out.
  force_uncertain: true
  high:
    min_primary_prob: 0.55
    min_margin: 0.15
  medium:
    min_primary_prob: 0.45
    min_margin: 0.08
  uncertain_margin: 0.08   # margin below this => UNCERTAIN

# Scraping
scraper:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
  timeout: 30
  retries: 3
  cache_ttl_hours: 6

# Prediction sources
predictor:
  # Minimum rapidfuzz WRatio (on affix-stripped names) for a fuzzy team match.
  # Exact and prefix matches bypass this; it only gates the last-resort step.
  fuzzy_threshold: 88
  # A fuzzy hit is rejected as ambiguous unless it beats the runner-up by this
  # many points — "wrong team" is far worse than "fell back to market odds".
  fuzzy_ambiguity_margin: 6
  # When a fixture's league/teams are outside EdgeBot coverage, fall back to
  # de-vigged SportPesa odds (the jackpot API publishes 1X2 prices per match).
  odds_fallback: true
  # Blend for covered fixtures: p = w*model + (1-w)*odds_implied. 1.0 = model only.
  model_weight: 1.0
  # Tier-1 quality gate (the tier-2 equivalent lives inside EdgeBot's
  # Tier2Stack and needs no config here). Reads EdgeBot's
  # data_cache/tier1_gates.json, written by train_tier1_gate.py --write-gates:
  # a league whose walk-forward Brier does not significantly beat the
  # bookmaker's never displaces the market price. On the 2026-09-05 run that is
  # every one of the 22 tier-1 leagues, so this effectively routes tier-1
  # through de-vigged odds until a league earns its way back.
  tier1_gate:
    enabled: true
    # Policy for a tier-1 league with no gate entry (or no gates file at all).
    # "fail" = treat as gated out. Unknown is not the same as passing, and the
    # measured pass rate is 0 of 22, so the safe reading of silence is failure.
    missing: fail
  # Sharper prices than SportPesa's for the leagues The Odds API carries
  # (EdgeBot's keys; one credit per league per run). The pick IS the price
  # once every model is gated, so this is the one free lever on pick
  # quality. Pinnacle preferred, else the median across EU books; SportPesa's
  # own price is the fallback and is always kept on the row for comparison.
  sharp_odds:
    enabled: true
    prefer_book: pinnacle
    kickoff_tolerance_hours: 3
    min_match_score: 80

# Market-odds calibration, applied to the odds-fallback path only.
#   method      - how the bookmaker margin is removed from the 1X2 prices.
#                 "power" (odds-ratio) and "shin" strip proportionally more
#                 from longshots than "proportional" does, which is the
#                 documented shape of the favourite-longshot bias.
#   temperature - p^t renormalized. t > 1 sharpens. Fitted at ~3.0 on the
#                 first 97 graded matches; held at 1.5 because that estimate
#                 carries a wide interval on so few games and shrinking a
#                 noisy calibration parameter toward 1.0 is the safe error.
#                 NOTE: this is monotone, so it never changes which outcome is
#                 picked — it only makes the stated confidence honest.
odds_calibration:
  method: power
  temperature: 1.5

# External insight sources (best-effort — failures never block a run)
insights:
  forebet:
    # OFF since 2026-08-29: Cloudflare has answered 403 to every request from
    # this host since 2026-07-17 — not a header problem, the plain HTML page is
    # blocked too, so the documented 0.25 consensus blend has never applied.
    # The only ways back in are a paid/allow-listed route or a real browser;
    # until one exists this just spends two failing requests a run. Flip back
    # to true and re-run to re-test.
    enabled: false
    # Require BOTH team names to clear this fuzzy score within the fixture's
    # country before trusting a Forebet record.
    min_match_score: 70
    # Blend Forebet's probabilities into ours: p = (1-w)*base + w*forebet.
    # 0 = display-only. Applied to model and odds-fallback fixtures alike.
    blend_weight: 0.25
  sofascore:
    enabled: true
    min_match_score: 65

# Scheduling. Each stage sends the full slate: the preview N days before the
# earliest kickoff, the final on match day with prices refreshed (the timer
# fires main.py at both hours; a missed firing is caught up on the next one).
# Archive check (224 Supa jackpots): earliest first kickoff ever 13:00 EAT,
# so 11:00 EAT is always before the slate closes.
schedule:
  timezone: "Africa/Nairobi"
  stages:
    preview:
      days_before: 2
      send_hour_eat: 20
    final:
      days_before: 0
      send_hour_eat: 11

# Coupon for the 13/13 game (the player plays 13 of the 17 matches; prizes
# from 10/13). Built by predictor/coupon13.py on the starred top 13:
#   - every pick is the favourite from margin-free odds;
#   - up to `doubles` close matches get their top two outcomes (2**doubles
#     lines). A match is close when favourite <= fav_max, second outcome >=
#     second_min, the two together >= top2_min, nothing above no_double_above.
# Walk-forward backtest, scripts/backtest_coupon13.py, rounds #34-#243:
#   single favourite line   10+/13 in 2 of 202 rounds, returned 1,694 per
#                           1,000 staked (one 304k prize is 89% of that)
#   3 doubles               10+/13 in 6 of 202 rounds, returned 478 per 1,000
#   team-form deviations    16 played, 5 right; the favourites they replaced
#                           were right 8 times. REMOVED, not shipped.
# So doubles raise the chance of a prize about 3x for about 7.5x the cost.
# They are not an edge. doubles: 0 sends the single favourite line only.
coupon13:
  enabled: true
  doubles: 3
  fav_max: 0.45
  second_min: 0.28
  top2_min: 0.70
  no_double_above: 0.55
  backtest_note: "Backtest, 202 rounds: 10+ in 6 rounds with 3 doubles, in 2 with one line. Doubles cost about 7.5x more and returned less per shilling. A better chance, not a profit."

# Doubles coupon for the full Supa slate (17/17 game, prizes from 12/17).
# The `doubles` least-sure picks are covered with their top two outcomes;
# 5 doubles = 32 lines. Backtest #225-#236 on SportPesa odds and real prizes:
# ~2% a week to hit 13+/17, staked 384k, won 244k. 0 turns the block off.
coupon:
  doubles: 5
  # SportPesa does not publish the per-line price in the jackpot API; 1,000
  # TZS confirmed by the user 2026-09-28. With stake_confirmed false the
  # message marks the price as assumed.
  stake_per_line_tzs: 1000
  stake_confirmed: true

# Lean-against-the-crowd line — LOGGING ONLY. Shown in the message after the
# favourite line, saved on the round's JSON (favourite_line / lean_line) and
# graded per round into <type>_<round>_line_grades.json. It never changes the
# picks, the coupon, the stake or the number of lines.
#   per match: score(o) = ln p(o) - strength * ln crowd_share(o); highest wins.
#   p is the price the favourite line uses, margin removed, NOT sharpened by
#   odds_calibration.temperature. No odds -> home win on both lines.
#   crowd_share: share of public tickets holding the favourite, the draw when
#   it is not the favourite, and the underdog (other non-favourite side).
# Fitted on past rounds on another machine; refit before trusting.
# strength 0.30 (2026-11-15): of 0.10/0.15/0.20/0.25/0.30/0.40/0.50 the one
# whose moves off the favourite on #225-#243 (SportPesa odds, margin removed)
# came closest to the source backtest's ~10 of 17: 10.2 (0.25 -> 8.8,
# 0.40 -> 13.2). The mix differs from that backtest: ~1.6 draws + 8.6
# underdogs here vs ~6 + ~4 there.
lean_line:
  enabled: true
  strength: 0.30
  crowd_share:
    favourite: 0.54
    draw: 0.23
    underdog: 0.30

# After each grade, results_main.py refreshes one tarball of data/jackpots/
# (only when something in it changed). Copy it off with scp.
export:
  enabled: true
  path: /home/edgebot/jackpots_export_latest.tar.gz

# Delivery
delivery:
  telegram:
    enabled: true
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 465
